<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log("Width: " + screen.width);
        console.log("Height: " + screen.height);
        console.log("Available Width: " + screen.availWidth);
        console.log("Available Height: " + screen.availHeight);
        console.log("Width: " + screen.width + "<br>");
        console.log("Height: " + screen.height + "<br>");
        console.log("Available Width: " + screen.availWidth + "<br>");
        console.log("Available Height: " + screen.availHeight + "<br>");
        var grade = window.prompt("Enter the grade here:")
        switch (grade) {
            case 'A':
                document.write("you passed in first_class")
                document.write("<hr>")
                break
            case 'B':
                document.write("You passed in second class")
                break
            case 'C':
                document.write("You passed an average")
                break
            default:
                document.write("Enter the proper grade system")}
                
    </script>
</body>

</html>
